[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener-api"
version = "2.0.0"
description = "FastAPI URL Shortener with Telegram Bot Integration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "aiogram==3.3.0",
    "aiohttp==3.9.1",
    "segno==1.6.1",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "requests==2.31.0"
]

[tool.setuptools]
packages = ["app"]
